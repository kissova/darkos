name: Build iOS Tweak

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install ldid
        run: |
          brew install ldid

      - name: Build tweak
        run: |
          make clean
          make package FINALPACKAGE=1
          for dylib in .theos/obj/*.dylib; do
            install_name_tool -delete_rpath /Library/Frameworks "$dylib" 2>/dev/null || true
            install_name_tool -change /Library/Frameworks/CydiaSubstrate.framework/CydiaSubstrate @rpath/CydiaSubstrate.framework/CydiaSubstrate "$dylib" 2>/dev/null || true
            ldid -S "$dylib" || true
          done

      - name: Upload dylib and deb
        uses: actions/upload-artifact@v4
        with:
          name: darkos-build
          path: |
            .theos/obj/*.dylib
            packages/*.deb
